name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # الإصلاح: ملف gradlew الحالي مزيّف ويحمّل jar تالفاً.
      # نولّد الـ wrapper الرسمي من Flutter وننسخه (ملفات الإعداد تبقى كما هي).
      - name: Generate official Gradle wrapper
        run: |
          flutter create --platforms=android --project-name wrapper_gen /tmp/wrapper_gen
          cp /tmp/wrapper_gen/android/gradlew android/gradlew
          cp /tmp/wrapper_gen/android/gradlew.bat android/gradlew.bat
          cp /tmp/wrapper_gen/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          # مزامنة إصدارات Gradle وAGP وKotlin مع ما يتطلبه إصدار Flutter الحالي
          cp /tmp/wrapper_gen/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          S=/tmp/wrapper_gen/android/settings.gradle.kts
          AGP=$(grep -o 'com.android.application") version "[^"]*"' $S | sed 's/.*version "//; s/"//')
          KT=$(grep -o 'org.jetbrains.kotlin.android") version "[^"]*"' $S | sed 's/.*version "//; s/"//')
          echo "AGP=$AGP KOTLIN=$KT"
          if [ -n "$AGP" ]; then sed -i "s#com.android.application\" version \"[^\"]*\"#com.android.application\" version \"$AGP\"#" android/settings.gradle; fi
          if [ -n "$KT" ]; then sed -i "s#org.jetbrains.kotlin.android\" version \"[^\"]*\"#org.jetbrains.kotlin.android\" version \"$KT\"#" android/settings.gradle; fi
          cat android/gradle/wrapper/gradle-wrapper.properties android/settings.gradle
          ls -la android/gradle/wrapper

      # ic_launcher.png في drawable ملف صورة تالف (AAPT لا يستطيع ترجمته) والمانيفست لا يستخدمه
      - name: Remove invalid launcher PNG
        run: |
          f=android/app/src/main/res/drawable/ic_launcher.png
          if [ -f "$f" ]; then file "$f"; rm -f "$f"; echo "removed $f"; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
